<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gui Calculator</title>
    <link rel="icon" type="image/x-icon" href="/Assests/calculator.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="heading">Calculator</h1>
    <div class="container">
        <div class="outer">
        <div class="calculator">
            <div class="display">
                <input type="text" class="screen"  id="display" readonly>
            </div>
            <div class="row-1">
            <button  onclick="clearScreen()" class="btn-clear">AC</button>
            <button  onclick="appendOnClick('00')" class="btn-00">00</button>
            <button onclick="appendOnClick('%')" class="btn-r">%</button> 
            <button onclick="appendOnClick('/')" class="btn-d">/</button> 
            </div>
            <div class="row-2">
                <button onclick="appendOnClick('7')" class="btn-7">7</button> 
                <button onclick="appendOnClick('8')" class="btn-8">8</button> 
                <button onclick="appendOnClick('9')" class="btn-9">9</button> 
                <button onclick="appendOnClick('*')" class="btn-X">*</button> 
            </div>
            <div class="row-3">
                <button onclick="appendOnClick('4')" class="btn-4">4</button>
                <button onclick="appendOnClick('5')" class="btn-5">5</button>
                <button onclick="appendOnClick('6')" class="btn-6">6</button>
                <button onclick="appendOnClick('-')" class="btn--">-</button>
            </div>
            <div class="row-4">
                <button onclick="appendOnClick('1')" class="btn-1">1</button>
                <button onclick="appendOnClick('2')" class="btn-2">2</button>
                <button onclick="appendOnClick('3')" class="btn-3">3</button>
                <button onclick="appendOnClick('+')" class="btn-a">+</button>
            </div>
            <div class="row-5">
                <button onclick="appendOnClick('0')" class="btn-0">0</button> 
                <button onclick="appendOnClick('.')" class="btn-f">.</button> 
                <button onclick="calculate()" class="btn-e">=</button> 
                
            </div>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
